<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- The page is read on a phone, held in the hand that just left the game.
     `viewport-fit=cover` plus the safe-area padding in the stylesheet is what
     keeps the masthead clear of a notch. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#162234">
<title>{% if page.title %}{{ page.title }} — {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ site.description }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Barlow Semi Condensed is the game's own face (Assets/TRV/Fonts). Weights
     500/600 and their italics are exactly what the shell ships, so the page
     and the button that opened it are set in the same type. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,500;0,600;1,500;1,600&display=swap">
<!-- NOT `assets/css/style.css`. GitHub Pages' legacy build injects a default
     theme when `_config.yml` names none, and that theme also emits
     `assets/css/style.css` — it won the collision and served normalize.css
     over this page for one deploy. A path no theme claims is the fix. -->
<link rel="stylesheet" href="{{ '/assets/css/drift-versus.css' | relative_url }}">
</head>
<body>

<header class="masthead">
  <div class="wrap">
    <p class="wordmark">Drift Versus</p>
    <!-- Two chips, not a sidebar. The credits sit at the foot of a long
         policy, and the row that opens this page now promises them by name;
         this is the shortcut that makes that promise true on a phone. -->
    <nav class="jump">
      <a href="#the-short-version">Privacy</a>
      <a href="#credits">Credits</a>
    </nav>
  </div>
</header>

<main class="wrap" id="top">
  {{ content }}
</main>

<footer class="wrap foot">
  <p>Drift Versus — Muhammad Hazki Hariowibowo</p>
  <p><a href="mailto:driftversus.dev@gmail.com">driftversus.dev@gmail.com</a></p>
</footer>

</body>
</html>
