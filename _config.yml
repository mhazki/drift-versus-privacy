# No `theme:` line, and that is the point. This site used jekyll-theme-minimal
# until 2026-08-26; that theme puts a fixed sidebar beside the text on any
# viewport over 960px and reads as somebody else's project page. The page is
# opened from inside a portrait phone game (Settings -> ABOUT & PRIVACY), so
# it is laid out as one scrolling column in the game's own palette instead.
# `_layouts/default.html` + `assets/css/drift-versus.css` are the whole theme.
#
# Naming no theme does not mean no theme: the legacy Pages build injects a
# default one regardless, and only the layout above shadows it. Hence the
# stylesheet's name — see the comment on the <link> in the layout.
title: Drift Versus
description: Privacy policy and credits
